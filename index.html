<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Notes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍰</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Rye&display=swap" rel="stylesheet">
    
    <!-- FORZAR CACHÉ V20 - STICKERS MOVIL -->
    <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
    
    <!-- STICKERS DE FONDO (MESA) - AHORA SON PNGs TRANSPARENTES -->
    <img src="roll.png" class="bg-sticker sticker-roll" alt="Cinnamon Roll">
    <img src="remy.png" class="bg-sticker sticker-remy" alt="Remy Ratatouille">
    <img src="snoopy.png" class="bg-sticker sticker-snoopy" alt="Snoopy Cookie">

    <header class="app-header">
        <div class="brand">
            <h1 style="font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: #8c5b65; font-weight: 700; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">Sweet Notes</h1>
        </div>
    </header>

    <!-- Botón flotante para mostrar herramientas cuando están ocultas -->
    <button id="open-toolbar-btn" class="open-toolbar-btn hidden" title="Mostrar herramientas">✨</button>

    <div class="toolbar" id="main-toolbar">
        <select id="fontName" title="Tipo de letra">
            <option value="'Lora', serif">Clásica</option>
            <option value="'Dancing Script', cursive">Caligrafía</option>
            <option value="'Special Elite', monospace">Máquina de escribir</option>
        </select>
        <select id="fontSize" title="Tamaño">
            <option value="3">Normal</option>
            <option value="5">Título Grande</option>
            <option value="6">Título Enorme</option>
        </select>
        
        <div class="divider"></div>
        
        <div class="color-palette">
            <button class="color-swatch" style="background-color: #4A3B32;" data-color="#4A3B32" title="Tinta Antigua"></button>
            <button class="color-swatch" style="background-color: #8C5B65;" data-color="#8C5B65" title="Vino/Fucsia Oscuro"></button>
            <button class="color-swatch" style="background-color: #D98A9D;" data-color="#D98A9D" title="Rosa Viejo"></button>
            <button class="color-swatch" style="background-color: #F4C2C2;" data-color="#F4C2C2" title="Rosa Pastel"></button>
            <button class="color-swatch" style="background-color: #9CAF88;" data-color="#9CAF88" title="Verde Salvia"></button>
        </div>

        <div class="divider"></div>

        <button class="tool-btn" data-command="bold" title="Negrita"><b>B</b></button>
        <button class="tool-btn" data-command="italic" title="Cursiva"><i>I</i></button>
        <button class="tool-btn" data-command="underline" title="Subrayado"><u>U</u></button>
        
        <div class="divider"></div>
        
        <button class="tool-btn" data-command="justifyLeft" title="Alinear Izquierda">⫷</button>
        <button class="tool-btn" data-command="justifyCenter" title="Centrar">≡</button>
        <button class="tool-btn" data-command="insertUnorderedList" title="Viñetas">•</button>
        
        <div class="divider"></div>
        
        <button class="tool-btn" id="btn-heart" title="Insertar Corazón">♡</button>
        
        <div class="divider"></div>

        <button class="tool-btn" id="add-photo-btn" title="Añadir foto">📷</button>
        <input type="file" id="image-upload" accept="image/*" style="display: none;">
        
        <!-- Botón para colapsar -->
        <button class="tool-btn" id="close-toolbar-btn" title="Ocultar herramientas" style="margin-left: 5px; color: #d98a9d; font-weight: bold;">✕</button>
    </div>

    <div class="app-container">
        <main class="book-container">
            <button id="prev-page" class="nav-btn left-nav" title="Página anterior">❮</button>
            
            <div class="book is-cover" id="book-element">
                
                <!-- PÁGINA IZQUIERDA -->
                <div class="page left-page">
                    <div class="page-content" id="page-left" contenteditable="true"></div>
                    <div class="page-number" id="num-left">1</div>
                </div>

                <!-- PÁGINA DERECHA -->
                <div class="page right-page">
                    <div class="page-content" id="page-right" contenteditable="true"></div>
                    <div class="page-number" id="num-right">2</div>
                </div>
            </div>

            <button id="next-page" class="nav-btn right-nav" title="Siguiente página">❯</button>
        </main>
        
        <div id="save-indicator" class="save-indicator">Guardado...</div>
    </div>

    <!-- BOTÓN FLOTANTE: VOLVER AL ÍNDICE -->
    <button id="go-to-index-btn" class="go-to-index-btn" title="Ir al Índice de Recetas">
        <span class="go-to-index-icon">🔖</span>
        <span class="go-to-index-label">Índice</span>
    </button>

    <script src="script.js?v=20"></script>
</body>
</html>
